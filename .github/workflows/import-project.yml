name: Import project

on:
  push:
    paths:
      - ".import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and import project
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part00.b64 .import/part01.b64 .import/part02.b64 .import/part03.b64 .import/part04.b64 | base64 --decode > /tmp/kettu-dm-export.zip
          echo "082569cb5a266f4ae318ed5a5c9027e89d283c478b40b0d73356c995633e7b3e  /tmp/kettu-dm-export.zip" | sha256sum -c -
          rm -rf /tmp/kettu-import
          mkdir -p /tmp/kettu-import
          unzip -q /tmp/kettu-dm-export.zip -d /tmp/kettu-import
          cp -a /tmp/kettu-import/kettu-dm-export/. .
          rm -rf .import
          rm -f .github/workflows/import-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import kettu-dm-export project"
          git push
